name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - k8s
  pull_request:
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------------------------------------
      # Generate Docker tags
      # -------------------------------------------------------

      - name: Generate frontend tags
        id: frontend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/todo-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,enable=${{ github.ref == 'refs/heads/main' }}

            type=raw,value=k8s-latest,enable=${{ github.ref == 'refs/heads/k8s' }}
            type=sha,prefix=k8s-,enable=${{ github.ref == 'refs/heads/k8s' }}

            type=ref,event=pr

      - name: Generate backend tags
        id: backend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/todo-backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,enable=${{ github.ref == 'refs/heads/main' }}

            type=raw,value=k8s-latest,enable=${{ github.ref == 'refs/heads/k8s' }}
            type=sha,prefix=k8s-,enable=${{ github.ref == 'refs/heads/k8s' }}

            type=ref,event=pr

      # -------------------------------------------------------
      # Build and push frontend
      # -------------------------------------------------------

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./to-do-list-app
          file: ./to-do-list-app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------------------------------------
      # Build and push backend
      # -------------------------------------------------------

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./to-do-list-backend
          file: ./to-do-list-backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max