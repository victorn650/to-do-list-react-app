
name: Build and Push Compose Images

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build Compose Images and Push to Registry
    runs-on: ubuntu-latest

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a #v4.0.0

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate frontend tags
        id: frontend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/todo-frontend
          tags: |
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Generate backend tags
        id: backend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/todo-backend
          tags: |
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Compose images
        run: |
          docker compose build frontend backend

      - name: Tag frontend image
        run: |
          docker tag \
            ${{ vars.DOCKERHUB_USERNAME }}/todo-frontend:latest \
            ${{ vars.DOCKERHUB_USERNAME }}/todo-frontend:${{ github.sha }}

      - name: Tag backend image
        run: |
          docker tag \
            ${{ vars.DOCKERHUB_USERNAME }}/todo-backend:latest \
            ${{ vars.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }}

      - name: Push frontend
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/todo-frontend:${{ github.sha }}

      - name: Push backend
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }}
      
      - name: Push frontend latest
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/todo-frontend:latest

      - name: Push backend latest
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/todo-backend:latest